name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip Android project
        run: unzip -o EvoSimAndroid-source.zip -d project

      - name: Build debug APK
        working-directory: project/EvoSimAndroid
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EvoSim-debug-apk
          path: project/EvoSimAndroid/app/build/outputs/apk/debug/app-debug.apk
